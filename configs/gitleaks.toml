[[rules]]
id = "google-api-key"
description = "Google API key used for accessing Google Cloud APIs and services.\nKeys use the AIza prefix and are 39 characters total. An attacker\nwith this key can access any Google API the key is authorized for,\nincluding Maps, YouTube, Cloud, Gemini, and other services. Keys\nare associated with Google Cloud projects for quota and billing.\nGoogle considers API keys semi-public identifiers, but they can\nstill enable unauthorized API usage and incur billing charges.\n"
regex = "\\b(AIza[0-9A-Za-z_-]{35})(?:[^0-9A-Za-z_-]|$)"
secretGroup = 1

[[rules]]
id = "google-oauth-credentials-2"
description = "Google OAuth Credentials"
regex = "\\b([0-9]+-[a-z0-9_]{32}\\.apps\\.googleusercontent\\.com)(?:(?s).{0,40})\\b(?:(?i)client.?secret.{0,10})?((?:GOCSPX-[a-zA-Z0-9_-]{28})|(?:\\b[a-zA-Z0-9_-]{24}))(?:[^a-zA-Z0-9_-]|$)"
secretGroup = 1

[[rules]]
id = "google-api-key-base64-encoded"
description = "Base64-encoded Google API key. The original key uses the AIza prefix\n(39 characters total), which encodes to a 52-character base64 string\nstarting with QUl6YVN. Applications sometimes encode API keys to\nobfuscate them or for transport encoding. An attacker can decode the\nkey and use it to access Google Cloud APIs the key is authorized for.\n"
regex = "(QUl6YVN[A-Za-z0-9+/]{45}={0,2})(?:[^A-Za-z0-9+/=]|$)"
secretGroup = 1

[[rules]]
id = "google-maps-api-key"
description = "Google Maps API key identified by context (variable names containing\n'google', 'gmap', 'gmaps', or 'maps' near 'key' or 'token'). These keys\nuse the standard Google API format (AIza prefix, 39 characters) and can\naccess Maps JavaScript API, Geocoding, Places, Directions, and other\nMaps Platform services. Exposed keys can lead to quota theft and billing\ncharges on the key owner's Google Cloud account.\n"
regex = "(?i)(?:google|gmap|gmaps|maps)(?:.|[\\n\\r]){0,30}?(?:api)?(?:.|[\\n\\r]){0,10}?(?:key|token|secret)(?:.|[\\n\\r]){0,20}?(AIza[0-9A-Za-z_-]{35})(?:[^0-9A-Za-z_-]|$)"
secretGroup = 1

