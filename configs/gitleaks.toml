[[rules]]
id = "generic-api-key-2"
description = "Detected a Generic API Key, potentially exposing access to various services and sensitive operations."
regex = "(?i)[\\w.-]{0,50}?(?:access|auth|(?-i:[Aa]pi|API)|credential|creds|key|passw(?:or)?d|secret|token)(?:[ \\t\\w.-]{0,20})[\\s'\"]{0,3}(?:=|>|:{1,3}=|\\|\\||:|=>|\\?=|,)[\\x60'\"\\s=]{0,5}([\\w.=-]{10,150}|[a-z0-9][a-z0-9+/]{11,}={0,3})(?:\\\\?['\"\\x60]|[\\s;]|\\\\[nr]|$)"
secretGroup = 1
entropy = 3.5
keywords = [
    "access",
    "api",
    "auth",
    "credential",
    "creds",
    "key",
    "passwd",
    "password",
    "secret",
    "token",
]

[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = "(?i)secret.{0,20}([0-9a-z]{32,64})\\b"
secretGroup = 1
entropy = 3.3
keywords = [
    "secret",
]

[[rules]]
id = "generic-api-key-3"
description = "Generic API Key"
regex = "(?i)(?:api_key|apikey|access_key|accesskey)(?:.|[\\n\\r]){0,8}?([0-9a-z][0-9a-z\\-._/+]{30,62}[0-9a-z])\\b"
secretGroup = 1
entropy = 3.3

[[rules]]
id = "generic-username-and-password"
description = "Generic Username and Password"
regex = "(?i)(?:username|user)(?:.|[\\n\\r]){0,16}?(?:password|pass)(?:.|[\\n\\r]){0,16}?[\"']([^\"']{5,30})[\"']"
secretGroup = 1
entropy = 3.3

[[rules]]
id = "generic-username-and-password-2"
