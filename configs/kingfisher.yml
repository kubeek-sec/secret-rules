  pattern: \b(?i:client[_-]?token)\s*=\s*(akab-[A-Za-z0-9_-]{18,28})\b
  confidence: medium
  min_entropy: 3.0
  references:
  - https://techdocs.akamai.com/developer/docs/set-up-authentication-credentials
  examples:
  - client-token=akab-sXedJBTOf0dHl27vVOd
  - client_token = akab-c113ntt0k3n4qtari252bfxxbsl-yvsdj
- name: Akamai API Client Secret
  id: secretrules.akamai.2
  pattern: \b(?i:client[_-]?mysecret|client[_-]?secret)\s*=\s*([A-Za-z0-9+/=-]{20,36})
  confidence: medium
  min_entropy: 3.0
  references:
  - https://techdocs.akamai.com/developer/docs/set-up-authentication-credentials
  - https://techdocs.akamai.com/iam-api/reference/api-client-self
  - https://techdocs.akamai.com/developer/docs/make-your-first-api-call
  examples:
  - client-secret=431733QPkO-TgxBHBnH6alirfy
  - client-mysecret=BcDeFgHi2345JKLM67nopqRS
  - client_secret = C113nt53KR3TN6N90yVuAgICxIRwsObLi0E67/N8eRN=
- name: Akamai API Access Token
  id: secretrules.akamai.3
  pattern: \b(?i:access[_-]?token)\s*=\s*(akab-[A-Za-z0-9_-]{18,36})\b
  confidence: medium
  min_entropy: 3.0
  references:
  - https://techdocs.akamai.com/developer/docs/set-up-authentication-credentials
  examples:
  - access-token=akab-xcsuUf7DY6xJgYscoe
  - access_token = akab-acc35t0k3nodujqunph3w7hzp7-gtm6ij
- name: Akamai API Host
  id: secretrules.akamai.4
  pattern: \b(?i:host)\s*=\s*([A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.akamaiapis\.net)\b
  confidence: medium
  min_entropy: 2.0
  references:
  - https://techdocs.akamai.com/developer/docs/set-up-authentication-credentials
  examples:
