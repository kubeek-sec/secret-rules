- name: Zapier Webhook URL
  id: secretrules.zapier.1
  pattern: \b(https://hooks\.zapier\.com/hooks/catch/[0-9]{5,10}/[a-z0-9]{5,12}/?)
  confidence: medium
  min_entropy: 3.4
  references:
  - https://help.zapier.com/hc/en-us/articles/8496288690317-Trigger-Zaps-from-webhooks
  examples:
  - ZAPIER_WEBHOOK=https://hooks.zapier.com/hooks/catch/99999999/notalive/
  - webhook_url="https://hooks.zapier.com/hooks/catch/99999998/notlive/"
- name: Zapier Webhook URL
  id: secretrules.zapier.2
  pattern: https?://(?:www\.)?hooks\.zapier\.com/hooks/catch/([0-9]{5,10})/([a-z0-9]{5,10})/?
  confidence: medium
  references:
  - https://help.zapier.com/hc/en-us/articles/8496288690317-Trigger-Zaps-from-webhooks
  - https://github.com/streaak/keyhacks#Zapier-Webhook-Token
  - https://docs.gitguardian.com/secrets-detection/detectors/specifics/zapier_webhook_url
  examples:
  - ZAPIER_WEBHOOK=https://hooks.zapier.com/hooks/catch/11595998/3ouwv7m/
  - webhook_url = 'https://hooks.zapier.com/hooks/catch/2929690/ztd17n/'
  - '# Zapier integration endpoint

    ENDPOINT = "https://hooks.zapier.com/hooks/catch/15616669/38qwq19/"

    '
  negative_examples:
  - https://hooks.zapier.com/hooks/catch/123/abc
  - https://hooks.zapier.com/hooks/catch/12345678901/abcdefghijk
  - https://hooks.example.com/hooks/catch/1234567/abcdefg/
  - https://hooks.zapier.com/hooks/catch/YOUR_HOOK_ID/
  - https://hooks.zapier.com/hooks/catch/xxxxxxx/yyyyyy/
  - https://hooks.zapier.com/hooks/catch/XXXXXX/high/
- name: Zendesk Subdomain
  id: secretrules.zendesk.1
  pattern: (?i)\b([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.zendesk\.com)\b
  confidence: medium
  min_entropy: 2.0
  references:
  - https://developer.zendesk.com/api-reference/introduction/doc-conventions/
  examples:
  - acme-support.zendesk.com
  - helpdesk-prod.zendesk.com
- name: Zendesk Account Email
  id: secretrules.zendesk.2
  pattern: (?i)\b(?:zendesk|zd)(?:.|[\n\r]){0,32}?(?:email|user(?:name)?)(?:.|[\n\r]){0,12}?([A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,})\b
  confidence: medium
  min_entropy: 2.0
  references:
  - https://developer.zendesk.com/api-reference/introduction/security-and-auth/
  examples:
  - ZENDESK_EMAIL=agent@example.com
  - 'zendesk_user: "support.bot@example.org"'
- name: Zendesk API Token
  id: secretrules.zendesk.3
  pattern: (?i)\b(?:zendesk|zd)(?:.|[\n\r]){0,48}?(?:api[\s_.-]*token|token|api[\s_.-]*key)(?:.|[\n\r]){0,16}?([A-Za-z0-9]{40})\b
  confidence: medium
  min_entropy: 3.8
  pattern_requirements:
    ignore_if_contains:
    - example
    - placeholder
    - yourtoken
  references:
  - https://developer.zendesk.com/api-reference/introduction/security-and-auth/
  - https://developer.zendesk.com/api-reference/ticketing/account-configuration/current_user/
  examples:
  - ZENDESK_API_TOKEN=a3B8f29E4d1C6a0578e23D9f41b6C8e2qR7tY4uI
  - zendesk_token="E7d2A1f849c3B05d6e81F2a794c3D5b0pQ8wX1zK"
- name: Zendesk API Token
  id: secretrules.zendesk.4
  pattern: (?i)(?:zendesk|zd)(?:.|[\n\r]){0,32}?(?:TOKEN|KEY|SECRET|API)(?:.|[\n\r]){0,16}?\b([A-Za-z0-9]{40})\b
  confidence: medium
  references:
  - https://developer.zendesk.com/api-reference/
  examples:
  - ZENDESK_API_TOKEN=a3B8f29E4d1C6a0578e23D9f41b6C8e2qR7tY4uI
  - 'zendesk_token: "E7d2A1f849c3B05d6e81F2a794c3D5b0pQ8wX1zK"'
  - export ZENDESK_TOKEN=9f4B2d7E1a3c8056d2E7f1b94A6c3d80mN5vL2jH
  negative_examples:
  - ZENDESK_API_TOKEN=abcdef1234
  - zendesk_token=your-token-here
  - ZENDESK_API_TOKEN=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
