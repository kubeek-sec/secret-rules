  references:
  - https://api.nasa.gov
  examples:
  - "get('https://api.nasa.gov/planetary/earth/imagery?api_key=fWfSMcDzyHfMuH8BW6jiIUBYaj0hKRyKBRTBqgEQ')\n  .then(...)\n"
  base_score: 50
- name: NASA API Key
  id: sr.nasa.2
  pattern: \bnasa\.gov/.{0,200}api_key=(?P<secret>[a-zA-Z0-9]{40})\b
  description: 'A NASA API key was found. This API key allows access to several rate-limited APIs. An attacker could use this API key to consume limited resources and cause denial of service.

    '
  categories:
  - api
  - secret
  - fuzzy
  references:
  - https://api.nasa.gov
  examples:
  - "get('https://api.nasa.gov/planetary/earth/imagery?api_key=fWfSMcDzyHfMuH8BW6jiIUBYaj0hKRyKBRTBqgEQ')\n  .then(function(response) {\n    // There is an issue with the image being pulled from the API, so using a different one instead\n    document.getElementsByClassName('targetImage')[0].src = \"https://api.nasa.gov/images/earth.png\";\n"
  base_score: 40
